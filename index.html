<!DOCTYPE html>
<!--
=====================================================================
 SPEEDOMETER PWA - companion files (save next to index.html, serve over HTTPS)
=====================================================================

 ---------- manifest.json ----------
 {
   "name": "Speedometer",
   "short_name": "Speed",
   "start_url": "./index.html",
   "scope": "./",
   "display": "standalone",
   "orientation": "any",
   "background_color": "#000000",
   "theme_color": "#000000",
   "icons": [
     { "src": "icon-192.png", "sizes": "192x192", "type": "image/png", "purpose": "any maskable" },
     { "src": "icon-512.png", "sizes": "512x512", "type": "image/png", "purpose": "any maskable" }
   ]
 }

 ---------- sw.js ----------
 const CACHE = 'speedometer-v1';
 const SHELL = ['./', './index.html', './manifest.json', './icon-192.png', './icon-512.png'];

 // Install: pre-cache the app shell (a missing icon will not break install)
 self.addEventListener('install', (e) => {
   e.waitUntil(
     caches.open(CACHE)
       .then((c) => Promise.all(SHELL.map((u) => c.add(u).catch(() => {}))))
       .then(() => self.skipWaiting())
   );
 });

 // Activate: delete old cache versions
 self.addEventListener('activate', (e) => {
   e.waitUntil(
     caches.keys()
       .then((keys) => Promise.all(keys.filter((k) => k !== CACHE).map((k) => caches.delete(k))))
       .then(() => self.clients.claim())
   );
 });

 // Fetch: cache-first for same-origin files. Overpass API calls (cross-origin)
 // are left alone so the app handles their failure itself.
 self.addEventListener('fetch', (e) => {
   const url = new URL(e.request.url);
   if (e.request.method !== 'GET' || url.origin !== location.origin) return;
   e.respondWith(
     caches.match(e.request, { ignoreSearch: true }).then((hit) =>
       hit || fetch(e.request).then((res) => {
         const copy = res.clone();
         caches.open(CACHE).then((c) => c.put(e.request, copy));
         return res;
       }).catch(() => caches.match('./index.html'))
     )
   );
 });

 ---------- Install notes ----------
 - Host all files on any HTTPS site (GitHub Pages, Netlify, etc.). Geolocation and
   service workers require HTTPS.
 - Add icon-192.png and icon-512.png (black square, white mark) beside index.html.
 - iOS: open in Safari > Share > Add to Home Screen.
 - Android: open in Chrome > menu > Install app / Add to Home screen.
 - Open the app once online so the shell is cached; after that it loads offline.
=====================================================================
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Speedometer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<!-- PWA / iOS standalone meta tags -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Speedometer">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" id="touchIcon" href="icon-192.png">

<style>
  :root {
    --bg: #000000;
    --fg: #ffffff;
    --alert: #ff1a1a;
    --dim: #8a8a8a;
    box-sizing: border-box;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* Edge-to-edge layout kept clear of notch and home indicator */
  .dash {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-evenly;
    padding:
      calc(env(safe-area-inset-top, 0px) + 16px)
      calc(env(safe-area-inset-right, 0px) + 16px)
      calc(env(safe-area-inset-bottom, 0px) + 16px)
      calc(env(safe-area-inset-left, 0px) + 16px);
  }
  .block { display: flex; flex-direction: column; align-items: center; }

  .label {
    font-size: clamp(14px, 3.4vmin, 26px);
    font-weight: 600;
    letter-spacing: 0.12em;
    margin-bottom: 1.2vmin;
  }

  /* Speed limit: US regulatory sign (white plate, black inset border, rounded corners) */
  .sign {
    --w: min(50vw, 25vh);                 /* sign width; everything inside scales from it */
    width: var(--w);
    min-width: 110px;
    aspect-ratio: 3 / 4;
    background: #ffffff;
    border-radius: calc(var(--w) * 0.1);
    padding: calc(var(--w) * 0.035);
  }
  .sign-in {
    height: 100%;
    border: calc(var(--w) * 0.035) solid #111111;
    border-radius: calc(var(--w) * 0.07);
    background: #ffffff;
    color: #111111;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-evenly;
    text-align: center;
  }
  .sign-txt {
    font-size: calc(var(--w) * 0.16);
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: 0.02em;
  }
  #limit {
    font-size: calc(var(--w) * 0.46);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  #limit.wide { font-size: calc(var(--w) * 0.34); }   /* 3-digit limits (km/h) */

  /* Your speed: huge digits, red when over the limit (no transition = instant) */
  .speed {
    font-size: min(42vw, 26vh);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    line-height: 0.95;
    color: var(--fg);
  }
  .speed.over { color: var(--alert); }
  .unit {
    font-size: clamp(14px, 3.4vmin, 26px);
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--dim);
    margin-top: 1vmin;
  }

  .status {
    font-size: clamp(12px, 2.8vmin, 18px);
    color: var(--dim);
    text-align: center;
    min-height: 1.3em;
  }

  /* Unit toggle sits below the top safe area, tucked in the corner */
  #unitBtn {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 10px);
    right: calc(env(safe-area-inset-right, 0px) + 12px);
    background: transparent;
    color: var(--fg);
    border: 2px solid var(--dim);
    border-radius: 999px;
    padding: 8px 14px;
    font: 600 14px/1 inherit;
    font-family: inherit;
    cursor: pointer;
  }
  #unitBtn:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }

  /* Landscape: put the two blocks side by side */
  @media (orientation: landscape) and (max-height: 520px) {
    .dash { flex-direction: row; flex-wrap: wrap; align-content: center; }
    .sign { --w: min(22vw, 34vh); }
    .speed { font-size: min(28vw, 52vh); }
    .status { width: 100%; }
  }
</style>
</head>
<body>
<button id="unitBtn" type="button" aria-label="Switch between mph and km/h">MPH</button>

<main class="dash">
  <section class="block">
    <div class="sign" role="img" aria-label="Speed limit">
      <div class="sign-in">
        <div class="sign-txt">SPEED<br>LIMIT</div>
        <div id="limit">25</div>
      </div>
    </div>
  </section>

  <section class="block">
    <div class="label">YOUR SPEED</div>
    <div class="speed" id="speed">--</div>
    <div class="unit" id="unit">MPH</div>
  </section>

  <div class="status" id="status" role="status" aria-live="polite">Waiting for GPS</div>
</main>

<script>
(() => {
  'use strict';

  /* ------------------------------ Config ------------------------------ */
  const DEFAULT_LIMIT_MPH   = 25;   // Pennsylvania residential default
  const QUERY_RADIUS_M      = 1000; // Overpass "around" radius (meters)
  const REQUERY_DISTANCE_M  = 650;  // Re-query after moving this far from last query point (overlap = radius - this)
  const RETRY_DELAY_MS      = 15000;// Wait before retrying a failed Overpass query
  const MATCH_MIN_M         = 20;   // Min distance to a road to count as "on" it
  const MATCH_MAX_M         = 50;   // Max distance allowed even with poor GPS accuracy
  const HOLD_LIMIT_MS       = 5000; // Keep last limit this long after losing a match (intersections)
  const CACHE_MAX_AGE_MS    = 7 * 24 * 3600 * 1000; // Saved roads older than this get refreshed when online
  const IDB_NAME = 'speedometer', IDB_STORE = 'cache', IDB_KEY = 'roads';
  const MPS_TO_MPH          = 2.23694;
  const MPS_TO_KMH          = 3.6;
  const MPH_TO_KMH          = 1.609344;
  // OSM spec says a bare "50" means km/h, but US mappers usually tag "25 mph".
  // For bare numbers in this app (Pennsylvania) we assume mph.
  const BARE_MAXSPEED_UNIT  = 'mph';
  const OVERPASS_ENDPOINTS  = [
    'https://overpass-api.de/api/interpreter',
    'https://overpass.kumi.systems/api/interpreter'
  ];

  /* ------------------------------ State ------------------------------- */
  const $ = (id) => document.getElementById(id);
  const el = { limit: $('limit'), speed: $('speed'), unit: $('unit'),
               status: $('status'), btn: $('unitBtn') };

  let useKmh = false;
  try { useKmh = localStorage.getItem('unit') === 'kmh'; } catch (_) {}

  let pos = null;                 // {lat, lon, acc}
  let speedMps = null;            // latest GPS speed (m/s) or null
  let gpsState = 'searching';     // searching | ok | denied | error

  // In-memory road database: wayId -> {name, mph, pts:[[lat,lon]], bbox}
  let roadDb = new Map();
  let lastQuery = null;           // {lat, lon} of last SUCCESSFUL query
  let querying = false;
  let nextRetryAt = 0;

  let limitMph = DEFAULT_LIMIT_MPH;
  let roadName = '';
  let lastHitAt = 0;

  /* ------------------------------ Helpers ----------------------------- */
  // Great-circle distance in meters
  function haversine(aLat, aLon, bLat, bLon) {
    const R = 6371000, rad = Math.PI / 180;
    const dLat = (bLat - aLat) * rad, dLon = (bLon - aLon) * rad;
    const h = Math.sin(dLat / 2) ** 2 +
      Math.cos(aLat * rad) * Math.cos(bLat * rad) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }

  // Parse an OSM maxspeed tag into mph. Returns null for non-numeric values
  // such as "signals", "none", "walk", or "variable".
  function parseMaxspeed(raw) {
    if (!raw) return null;
    const first = String(raw).split(';')[0].trim().toLowerCase();
    const m = first.match(/^(\d+(?:\.\d+)?)\s*(mph|km\/h|kmh|kph)?$/);
    if (!m) return null;
    const n = parseFloat(m[1]);
    const unit = m[2] || BARE_MAXSPEED_UNIT;
    return unit === 'mph' ? n : n / MPH_TO_KMH;
  }

  // Distance (m) from a point to a segment, using a local flat projection
  function distToSegment(lat, lon, a, b) {
    const kx = 111320 * Math.cos(lat * Math.PI / 180), ky = 110540;
    const px = 0, py = 0;
    const ax = (a[1] - lon) * kx, ay = (a[0] - lat) * ky;
    const bx = (b[1] - lon) * kx, by = (b[0] - lat) * ky;
    const dx = bx - ax, dy = by - ay;
    const len2 = dx * dx + dy * dy;
    let t = len2 ? ((px - ax) * dx + (py - ay) * dy) / len2 : 0;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(ax + t * dx - px, ay + t * dy - py);
  }

  /* --------------------- Overpass query and cache --------------------- */
  async function fetchRoads(lat, lon) {
    // All ways with a maxspeed tag within the radius; "out geom" includes node coordinates.
    const q = `[out:json][timeout:25];way(around:${QUERY_RADIUS_M},${lat},${lon})[maxspeed];out tags geom;`;
    let lastErr;
    for (const url of OVERPASS_ENDPOINTS) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 30000);
      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: 'data=' + encodeURIComponent(q),
          signal: ctrl.signal
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return await res.json();
      } catch (err) {
        lastErr = err;
      } finally {
        clearTimeout(timer);
      }
    }
    throw lastErr;
  }

  function buildDb(json) {
    const db = new Map();
    for (const w of (json.elements || [])) {
      if (w.type !== 'way' || !w.geometry || w.geometry.length < 2) continue;
      const mph = parseMaxspeed(w.tags && w.tags.maxspeed);
      if (mph == null) continue;
      const pts = w.geometry.map((g) => [g.lat, g.lon]);
      let minLat = 90, maxLat = -90, minLon = 180, maxLon = -180;
      for (const [la, lo] of pts) {
        if (la < minLat) minLat = la; if (la > maxLat) maxLat = la;
        if (lo < minLon) minLon = lo; if (lo > maxLon) maxLon = lo;
      }
      db.set(w.id, {
        name: (w.tags && (w.tags.name || w.tags.ref)) || '',
        mph, pts, bbox: [minLat, minLon, maxLat, maxLon]
      });
    }
    return db;
  }

  async function maybeRefreshCache() {
    if (!pos || querying || Date.now() < nextRetryAt) return;
    const needs = !lastQuery ||
      haversine(lastQuery.lat, lastQuery.lon, pos.lat, pos.lon) > REQUERY_DISTANCE_M;
    if (!needs || !navigator.onLine) return;

    querying = true;
    const at = { lat: pos.lat, lon: pos.lon };
    try {
      const json = await fetchRoads(at.lat, at.lon);
      roadDb = buildDb(json);   // swap in the fresh cache
      lastQuery = at;           // only advance on success
      saveCache();              // persist for next launch / dead zones
    } catch (_) {
      // Keep the old cache; retry shortly
      nextRetryAt = Date.now() + RETRY_DELAY_MS;
    } finally {
      querying = false;
    }
  }

  /* ------------- Persistent cache (IndexedDB) ------------------------
     The road database is saved after every successful query and restored
     at launch, so closing the app or starting in a dead zone keeps the
     last known roads. All storage calls fail silently if unavailable. */
  function openIdb() {
    return new Promise((resolve, reject) => {
      const r = indexedDB.open(IDB_NAME, 1);
      r.onupgradeneeded = () => r.result.createObjectStore(IDB_STORE);
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
    });
  }

  async function saveCache() {
    try {
      const db = await openIdb();
      await new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).put(
          { roads: Array.from(roadDb), lastQuery, savedAt: Date.now() }, IDB_KEY);
        tx.oncomplete = resolve;
        tx.onerror = tx.onabort = () => reject(tx.error);
      });
      db.close();
    } catch (_) {}
  }

  async function loadCache() {
    try {
      const db = await openIdb();
      const rec = await new Promise((resolve, reject) => {
        const req = db.transaction(IDB_STORE).objectStore(IDB_STORE).get(IDB_KEY);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
      db.close();
      if (!rec || !Array.isArray(rec.roads)) return;
      roadDb = new Map(rec.roads);
      // Fresh enough: skip the startup query if still near the saved area.
      // Stale: keep using the roads, but force a refresh once online.
      const fresh = Date.now() - rec.savedAt <= CACHE_MAX_AGE_MS;
      lastQuery = fresh && rec.lastQuery ? rec.lastQuery : null;
    } catch (_) {}
  }

  /* ----------------------- Cache lookup (every 1s) -------------------- */
  function findRoad(lat, lon, acc) {
    const tol = Math.max(MATCH_MIN_M, Math.min(MATCH_MAX_M, acc || 0));
    const dLat = tol / 110540, dLon = tol / (111320 * Math.cos(lat * Math.PI / 180));
    let best = null, bestD = Infinity;
    for (const road of roadDb.values()) {
      const b = road.bbox;   // skip roads whose box is clearly too far away
      if (lat < b[0] - dLat || lat > b[2] + dLat || lon < b[1] - dLon || lon > b[3] + dLon) continue;
      for (let i = 0; i < road.pts.length - 1; i++) {
        const d = distToSegment(lat, lon, road.pts[i], road.pts[i + 1]);
        if (d < bestD) { bestD = d; best = road; }
      }
    }
    return bestD <= tol ? best : null;
  }

  function tick() {
    if (pos) {
      const hit = findRoad(pos.lat, pos.lon, pos.acc);
      const now = Date.now();
      if (hit) {
        limitMph = hit.mph; roadName = hit.name; lastHitAt = now;
      } else if (now - lastHitAt > HOLD_LIMIT_MS) {
        limitMph = DEFAULT_LIMIT_MPH; roadName = '';
      }
      maybeRefreshCache();
    }
    render();
  }

  /* ------------------------------- Render ----------------------------- */
  function render() {
    const factor = useKmh ? MPH_TO_KMH : 1;
    const limitShown = Math.round(limitMph * factor);
    el.limit.textContent = limitShown;
    el.limit.classList.toggle('wide', limitShown >= 100);
    el.unit.textContent = useKmh ? 'KM/H' : 'MPH';
    el.btn.textContent = useKmh ? 'KM/H' : 'MPH';

    if (speedMps == null) {
      el.speed.textContent = gpsState === 'ok' ? '0' : '--';
      el.speed.classList.remove('over');
    } else {
      const speedShown = Math.round(speedMps * (useKmh ? MPS_TO_KMH : MPS_TO_MPH));
      el.speed.textContent = speedShown;
      // Strictly greater than the limit, compared in the displayed unit
      el.speed.classList.toggle('over', speedShown > limitShown);
    }

    let msg;
    if (gpsState === 'denied') msg = 'Location blocked. Allow location access in settings.';
    else if (gpsState === 'error') msg = 'GPS signal lost. Retrying.';
    else if (gpsState === 'searching') msg = 'Waiting for GPS';
    else if (roadName) msg = roadName;
    else msg = roadDb.size ? 'No posted limit here, using default' : 'Using default limit';
    if (!navigator.onLine && gpsState === 'ok') msg += ' (offline, saved roads)';
    el.status.textContent = msg;
  }

  /* ------------------------------- GPS -------------------------------- */
  function onPosition(p) {
    gpsState = 'ok';
    pos = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy };
    // coords.speed is m/s, or null when the device cannot determine it
    speedMps = (typeof p.coords.speed === 'number' && p.coords.speed >= 0) ? p.coords.speed : null;
    render();
    maybeRefreshCache();
  }

  function onGpsError(err) {
    if (err.code === 1) gpsState = 'denied';
    else { gpsState = 'error'; speedMps = null; }
    render();
  }

  function startGps() {
    if (!('geolocation' in navigator)) { gpsState = 'error'; render(); return; }
    navigator.geolocation.watchPosition(onPosition, onGpsError, {
      enableHighAccuracy: true, maximumAge: 0, timeout: 15000
    });
  }

  /* --------------------------- UI and PWA bits ------------------------- */
  el.btn.addEventListener('click', () => {
    useKmh = !useKmh;
    try { localStorage.setItem('unit', useKmh ? 'kmh' : 'mph'); } catch (_) {}
    render();
  });
  window.addEventListener('online', () => { nextRetryAt = 0; render(); });
  window.addEventListener('offline', render);

  // Keep the screen awake while driving (ignored where unsupported)
  async function keepAwake() {
    try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (_) {}
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') keepAwake();
  });

  // Draw the home-screen icon at runtime so the single file still has an iOS icon
  function makeIcon() {
    try {
      const c = document.createElement('canvas'); c.width = c.height = 180;
      const g = c.getContext('2d');
      g.fillStyle = '#000'; g.fillRect(0, 0, 180, 180);
      g.strokeStyle = '#fff'; g.lineWidth = 10; g.strokeRect(40, 40, 100, 100);
      g.fillStyle = '#fff'; g.font = '800 54px -apple-system, Arial, sans-serif';
      g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('25', 90, 92);
      $('touchIcon').href = c.toDataURL('image/png');
    } catch (_) {}
  }

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  /* -------------------------------- Boot ------------------------------- */
  makeIcon();
  render();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (_) {}
  loadCache().then(startGps);   // restore saved roads first, then start GPS
  keepAwake();
  setInterval(tick, 1000);   // cross-reference live position with the cache each second
})();
</script>
</body>
</html>
